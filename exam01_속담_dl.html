<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 * {margin:0 padding: 0;}
 dl {width: 500px; border: double 4px; margin: 0 auto;}
 dt {display: block; text-align: center; letter-spacing: 7px; font-size: 20px; color: #fff; background: rgb(107, 137, 226); padding: 10px; border-bottom: 6px solid blue;}
.line {width: 95%; text-align: left; font-size: 13px; border-bottom: 3px dotted; } 
 dd {margin-left: 0; font-size: 13px; padding: 8px;}

    </style>
</head>
<body>

<dl>
 <dt>속담풀이</dt>
 <dd class="line">
    생각해보지 않고 나오는 대로 말하다가 실수하면 상대의 마음에 아픔을 남기게 된다.  
 </dd>
 <dd>호의적인 의사소통 방법은 자기 말만 하는 것보다 좋은 결과로 이어진다.</dd>
</dl>  

</body>
</html>
